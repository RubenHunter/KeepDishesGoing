<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title>KDG Payout Report</title>
    <style>
        body { font-family: sans-serif; font-size: 12pt; }
        h1 { color: #444; }
        h2 { margin-top: 16px; border-bottom: 1px solid #888; }
        table { width: 100%; border-collapse: collapse; margin-top: 6px; }
        th, td { border: 1px solid #ccc; padding: 4pt; text-align: left; }
        th { background-color: #eee; }
        .total { font-weight: bold; background: #f5f5f5; }
        .meta { color: #666; font-size: 10pt; }
    </style>
</head>
<body>
    <h1>KDG — Payout Report</h1>
    <p class="meta">Period: <span th:text="${from}"/> — <span th:text="${to}"/></p>

    <h2>Per Courier Summary</h2>
    <table>
        <tr><th>Courier ID</th><th># Deliveries</th><th>Total Payout</th></tr>
        <tr th:each="d : ${drivers}">
            <td th:text="${d.driverId}"/>
            <td th:text="${d.numDeliveries}"/>
            <td th:text="${#numbers.formatDecimal(d.total.amount, 2, 2)} + ' ' + ${d.total.currency}"/>
        </tr>
        <tr class="total">
            <td colspan="2">GRAND TOTAL</td>
            <td th:text="${grandTotal}"/>
        </tr>
    </table>

    <h2>Detailed Payouts</h2>
    <div th:each="d : ${drivers}">
        <h3 th:text="'Courier: ' + ${d.driverId}"/>
        <table>
            <tr>
                <th>Payout ID</th>
                <th>Delivery ID</th>
                <th>Ready At</th>
                <th>Delivered At</th>
                <th>Billable Minutes</th>
                <th>Total</th>
            </tr>
            <tr th:each="p : ${d.rows}">
                <td th:text="${p.id().value()}"/>
                <td th:text="${p.deliveryId().value()}"/>
                <td th:text="${p.readyAt()}"/>
                <td th:text="${p.deliveredAt()}"/>
                <td th:text="${p.billableMinutes()}"/>
                <td th:text="${#numbers.formatDecimal(p.total().amount, 2, 2)} + ' ' + ${p.total().currency}"/>
            </tr>
        </table>
    </div>
</body>
</html>
