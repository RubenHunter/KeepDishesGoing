spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/keepdishesgoing/protocol/openid-connect/certs
          issuer-uri: http://localhost:8180/realms/keepdishesgoing
  mvc:
    cors:
      mappings:
        "[/**]":
          allowed-origins: "*"
          allowed-methods: "*"
          allowed-headers: "*"

server:
  port: 8080

# Optional: make logs clearer while integrating
logging:
  level:
    org.springframework.security: INFO
