# H2 delivery integration test (no Docker required)
spring.datasource.url=jdbc:h2:mem:delivery;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=delivery
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.sql.init.mode=never

# Disable AMQP — handlers stay unwired; no broker needed for unit/integration tests
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Use fixed payout table for tests
kdg.delivery.payout.base-fee-eur=3.00
kdg.delivery.payout.per-minute-eur=0.30
kdg.delivery.payout.min-minutes=5
kdg.delivery.payout.max-minutes=30

logging.level.sql=warn
logging.level.web=warn