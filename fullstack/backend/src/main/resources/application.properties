spring.application.name=order-service

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=ordering
spring.jpa.properties.hibernate.jdbc.lob_non_contextual_creation=true

# ---- Schema bootstrap (kept simple; hibernate owns ordering schema tables) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql

# ---- RabbitMQ ----
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ---- Order service business config (US23/24 decision window is owned by restaurant though)
# These are read by order-service for the read-model + US39 strategy wiring
kdg.order.max-cart-items=50
kdg.order.price-category.default=FAST_FOOD
kdg.order.price-category.fine-dining-limit-euros=60

# ---- Outbound HTTP to restaurant-service ----
kdg.restaurant.base-url=http://localhost:8080
kdg.restaurant.api-base=/api/restaurants

# ---- Payment stub (US20) ----
kdg.payment.provider=stub
kdg.payment.stub.redirect-template=http://localhost:8081/api/payments/{ref}/confirm

# ---- Logging per grading rubric ----
logging.level.org.springframework.amqp=INFO
logging.level.be.kdg.backend=DEBUG
logging.level.sql=warn
logging.level.web=info