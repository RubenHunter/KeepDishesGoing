spring.application.name=order-service

# ---- Database ----
spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=ordering
spring.jpa.properties.hibernate.jdbc.lob_non_contextual_creation=true

# ---- Schema bootstrap (kept simple; hibernate owns ordering schema tables) ----
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql

# ---- RabbitMQ ----
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# ---- Order service business config ----
kdg.order.max-cart-items=50
kdg.order.price-category.default=FAST_FOOD
kdg.order.price-category.fine-dining-limit-euros=60

# ---- US23/US24: auto-reject stale PLACED orders ----
kdg.order.auto-reject-timeout-minutes=5
kdg.order.auto-reject-poll-seconds=30

# ---- Outbound HTTP to restaurant-service ----
kdg.restaurant.base-url=http://localhost:8080
kdg.restaurant.api-base=/api/restaurants

# ---- Payment (US20): stub | stripe. Stub is the dev default; stripe uses hosted Checkout ----
# Switch to Stripe at runtime with env var KDG_PAYMENT_PROVIDER=stripe (don't commit this edit).
kdg.payment.provider=stub
# Stub confirmation is done via HTTP file / manual POST carrying the shared-secret header.
kdg.payment.webhook-secret=dev-secret-change-me
kdg.payment.webhook-secret-header=X-Payment-Signature
# Stripe test-mode keys come from env vars, never committed. Set STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET.
kdg.payment.stripe.secret-key=${STRIPE_SECRET_KEY:}
kdg.payment.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
kdg.payment.stripe.success-url=http://localhost:5173/#/orders/{orderId}/confirmation
kdg.payment.stripe.cancel-url=http://localhost:5173/#/checkout

# ---- Keycloak JWT resource server (T2) ----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/keepdishesgoing/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/keepdishesgoing

# ---- Logging per grading rubric ----
logging.level.org.springframework.amqp=INFO
logging.level.be.kdg.backend=DEBUG
logging.level.sql=warn
logging.level.web=info