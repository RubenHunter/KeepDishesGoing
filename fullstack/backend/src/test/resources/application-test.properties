# H2 in-memory for fast integration tests (no Docker required).
spring.datasource.url=jdbc:h2:mem:ordering;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.default_schema=ordering
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.sql.init.mode=never

# Disable RabbitMQ entirely in tests — listener beans stay unwired (no broker dependency).
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

# Suppress noisy SQL logs during tests
logging.level.sql=warn
logging.level.web=warn

# Tests exercise the stub payment provider (no Stripe keys/network). Stripe-specific
# integration tests override this to "stripe" via @TestPropertySource.
kdg.payment.provider=stub