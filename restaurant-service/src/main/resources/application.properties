spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5443/postgres?currentSchema=restaurant
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.hibernate.ddl-auto=create
spring.jpa.open-in-view=false

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
spring.sql.init.data-locations=classpath:sql/data.sql

logging.level.sql=debug
logging.level.web=debug

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

logging.level.org.springframework.amqp=INFO

# US14 — prep-time estimate used at accept to verify feasibility before closing time
kdg.restaurant.prep-estimate-minutes=30

# US17 — price tolerance for menu-item validation (euros)
kdg.validation.price-tolerance=0.01

# US10 — max number of dishes available to customers at once (configurable per NFR)
kdg.restaurant.max-published-dishes=10

# ---- Keycloak JWT resource server ----
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/keepdishesgoing/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/keepdishesgoing

# ---- CORS (frontend on a separate Vite dev server) ----
spring.mvc.cors.mappings.[/**].allowed-origins=*
spring.mvc.cors.mappings.[/**].allowed-methods=*
spring.mvc.cors.mappings.[/**].allowed-headers=*

server.port=8080
logging.level.org.springframework.security=INFO

