spring.application.name=delivery-service

# Database — schema=delivery (PDF mandatory name)
spring.datasource.url=jdbc:postgresql://localhost:5443/postgres
spring.datasource.username=user
spring.datasource.password=password
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.default_schema=delivery
spring.jpa.properties.hibernate.jdbc.lob_non_contextual_creation=true
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:sql/schema.sql

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=user
spring.rabbitmq.password=password
spring.rabbitmq.virtual-host=/
spring.rabbitmq.listener.simple.missing-queues-fatal=false
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

# Keycloak JWT verification (security on driver + admin per PDF)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/keepdishesgoing/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/keepdishesgoing

# US34 / US36 — payout policy (configurable; grading-rubric requires externalization)
kdg.delivery.payout.base-fee-eur=3.00
kdg.delivery.payout.per-minute-eur=0.30
kdg.delivery.payout.min-minutes=5
kdg.delivery.payout.max-minutes=30

server.port=8082
logging.level.be.kdg.backend=DEBUG
logging.level.sql=warn
logging.level.web=info